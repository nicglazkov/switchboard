name: Docs

# Builds the documentation site (mkdocs.yml, docs/) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: [mkdocs.yml, docs/**, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, .github/workflows/docs.yml]
  pull_request:
    paths: [mkdocs.yml, docs/**, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    if: ${{ github.event.repository.name == 'switchboard' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build (warnings fail it, so a broken link never ships)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
