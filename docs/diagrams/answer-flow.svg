<svg viewBox="0 0 880 400" role="img" aria-labelledby="fig-answer-flow-t" xmlns="http://www.w3.org/2000/svg">
<title id="fig-answer-flow-t">A chat on the closet PC asks a question. The helper on that computer reports it, the board shows a card, you pick an answer, and the answer goes back to the chat.</title>
<text class="d-title" x="40" y="52">Answer from the board</text>
<rect class="d-panel" x="40" y="84" width="360" height="276" rx="14"/>
<g class="d-ico" transform="translate(60 102)"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></g>
<text x="94" y="120">Closet PC</text>
<text class="d-sub mid" x="120" y="156">Asks a question</text>
<rect class="d-chip" x="60" y="170" width="120" height="90" rx="14"/>
<text class="mid" x="120" y="220">Chat</text>
<text class="d-sub mid" x="320" y="156">Reports it</text>
<rect class="d-chip" x="260" y="170" width="120" height="90" rx="14"/>
<text class="mid" x="320" y="220">Helper</text>
<text class="d-sub mid" x="550" y="156">Shows a card</text>
<rect class="d-chip-sel" x="480" y="170" width="140" height="90" rx="14"/>
<text class="mid t-sel" x="550" y="220">Your board</text>
<text class="d-sub mid" x="780" y="156">Pick an answer</text>
<rect class="d-panel" x="720" y="170" width="120" height="90" rx="14"/>
<text class="mid" x="780" y="220">You</text>
<path class="d-req" d="M184 198H256"/>
<path class="d-req" d="M247 190L256 198L247 206"/>
<circle class="d-num-req" cx="220" cy="198" r="13"/>
<text class="d-num" x="220" y="198" dy="4.5">1</text>
<path class="d-req" d="M384 198H476"/>
<path class="d-req" d="M467 190L476 198L467 206"/>
<circle class="d-num-req" cx="430" cy="198" r="13"/>
<text class="d-num" x="430" y="198" dy="4.5">2</text>
<path class="d-req" d="M624 198H716"/>
<path class="d-req" d="M707 190L716 198L707 206"/>
<circle class="d-num-req" cx="670" cy="198" r="13"/>
<text class="d-num" x="670" y="198" dy="4.5">3</text>
