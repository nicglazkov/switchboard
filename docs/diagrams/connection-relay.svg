<svg viewBox="0 0 880 360" role="img" aria-labelledby="fig-connection-relay-t" xmlns="http://www.w3.org/2000/svg">
<title id="fig-connection-relay-t">The same laptop and home computer. The straight line between them is dotted, and the connection now runs up from the laptop, through the relay, and down to the home computer.</title>
<text class="d-title" x="40" y="52">Through the relay</text>
<rect class="d-chip-sel" x="340" y="84" width="200" height="60" rx="14"/>
<g class="d-ico sel" transform="translate(360 102)"><circle cx="12" cy="12" r="8.5"/><path d="M3.500 12h17M12 3.500c2.500 2.500 3.500 5.300 3.500 8.500s-1 6-3.500 8.500c-2.500-2.500-3.500-5.300-3.500-8.500s1-6 3.500-8.500z"/></g>
<text class="t-sel" x="394" y="120">Relay</text>
<text class="d-sub mid" x="440" y="174">Sees who talks, and how much.</text>
<text class="d-sub mid" x="440" y="194">Can't read any of it.</text>
<path class="d-line-sel" d="M150 160V126a12 12 0 0 1 12-12H336"/>
<path class="d-line-sel" d="M730 160V126a12 12 0 0 0-12-12H544"/>
<rect class="d-panel" x="40" y="164" width="220" height="140" rx="14"/>
<g class="d-ico" transform="translate(60 182)"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></g>
<text x="94" y="200">Laptop</text>
<rect class="d-chip" x="60" y="232" width="180" height="40" rx="20"/>
<text class="d-small mid" x="150" y="257">Helper</text>
<rect class="d-chip-sel" x="620" y="164" width="220" height="140" rx="16"/>
<g class="d-ico sel" transform="translate(640 182)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<text class="t-sel" x="674" y="200">Home computer</text>
<rect class="d-panel" x="640" y="232" width="180" height="40" rx="20"/>
<text class="d-small mid" x="730" y="257">Helper</text>
<path class="d-line d-dotted" d="M264 252H616"/>
<text class="mid" x="440" y="286">No direct path</text>
<text class="d-sub mid" x="440" y="306">Two networks that can't reach each other</text>
</svg>
