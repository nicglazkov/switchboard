<svg viewBox="0 0 880 440" role="img" aria-labelledby="fig-how-whole-t" xmlns="http://www.w3.org/2000/svg">
<title id="fig-how-whole-t">Two computers on the left each run chats and a helper. Both connect to the home computer in the middle, which keeps the board, the history and settings, and the library. The app and the phone on the right connect to the home computer too.</title>
<text class="d-title" x="40" y="52">What talks to what</text>
<rect class="d-panel" x="40" y="84" width="240" height="120" rx="14"/>
<g class="d-ico" transform="translate(60 102)"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></g>
<text x="94" y="120">Laptop</text>
<rect class="d-chip" x="60" y="148" width="96" height="36" rx="18"/>
<text class="d-small mid" x="108" y="171">Chats</text>
<rect class="d-chip" x="164" y="148" width="96" height="36" rx="18"/>
<text class="d-small mid" x="212" y="171">Helper</text>
<rect class="d-panel" x="40" y="224" width="240" height="120" rx="14"/>
<g class="d-ico" transform="translate(60 242)"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></g>
<text x="94" y="260">Closet PC</text>
<rect class="d-chip" x="60" y="288" width="96" height="36" rx="18"/>
<text class="d-small mid" x="108" y="311">Chats</text>
<rect class="d-chip" x="164" y="288" width="96" height="36" rx="18"/>
<text class="d-small mid" x="212" y="311">Helper</text>
<path class="d-line-sel" d="M280 144H320"/>
<path class="d-line-sel" d="M280 284H320"/>
<rect class="d-chip-sel" x="320" y="84" width="240" height="260" rx="16"/>
<g class="d-ico sel" transform="translate(340 102)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<text class="t-sel" x="374" y="120">Home computer</text>
<rect class="d-panel" x="340" y="150" width="200" height="34" rx="17"/>
<text class="d-small mid" x="440" y="172">The board</text>
<rect class="d-panel" x="340" y="192" width="200" height="34" rx="17"/>
<text class="d-small mid" x="440" y="214">History and settings</text>
<rect class="d-panel" x="340" y="234" width="200" height="34" rx="17"/>
<text class="d-small mid" x="440" y="256">The library</text>
<rect class="d-panel" x="340" y="276" width="200" height="34" rx="17"/>
<text class="d-small mid" x="440" y="298">Its own helper</text>
<path class="d-line-sel" d="M560 144H600"/>
<path class="d-line-sel" d="M560 284H600"/>
<rect class="d-panel" x="600" y="84" width="240" height="120" rx="14"/>
<g class="d-ico" transform="translate(620 102)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></g>
<text x="654" y="120">The app</text>
<text class="d-sub" x="620" y="160">On any of your computers</text>
<rect class="d-panel" x="600" y="224" width="240" height="120" rx="14"/>
<g class="d-ico" transform="translate(620 242)"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></g>
<text x="654" y="260">Your phone</text>
<text class="d-sub" x="620" y="300">The iPhone and Android apps</text>
<text class="d-sub mid" x="160" y="376">Chats run here.</text>
<text class="d-sub mid" x="160" y="396">The helper reports them.</text>
<text class="d-sub mid" x="440" y="376">Keeps the board</text>
<text class="d-sub mid" x="440" y="396">and passes messages on.</text>
<text class="d-sub mid" x="720" y="376">Show the board</text>
<text class="d-sub mid" x="720" y="396">and send what you type.</text>
