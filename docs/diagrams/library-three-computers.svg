<svg viewBox="0 0 880 464" role="img" aria-labelledby="fig-library-three-computers-t" xmlns="http://www.w3.org/2000/svg">
<title id="fig-library-three-computers-t">One library with three tools, and three computers below it. The desk Mac has all three, the laptop has two and one of them is missing a key, and the closet PC has one.</title>
