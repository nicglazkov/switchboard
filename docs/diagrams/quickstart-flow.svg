<g class="d-ico" transform="translate(728 244)"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></g>
<text class="mid" x="740" y="294">You</text>
<path class="d-req" d="M336 170H244"/>
<path class="d-req" d="M253 162L244 170L253 178"/>
<circle class="d-num-req" cx="290" cy="170" r="13"/>
<text class="d-num" x="290" y="170" dy="4.5">2</text>
<path class="d-req" d="M636 170H544"/>
<path class="d-req" d="M553 162L544 170L553 178"/>
<circle class="d-num-req" cx="590" cy="170" r="13"/>
<text class="d-num" x="590" y="170" dy="4.5">3</text>
<path class="d-req" d="M244 254H336"/>
