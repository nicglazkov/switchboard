<text x="594" y="120">Closet PC</text>
<text class="d-sub" x="560" y="166">Sent by Claude 1</text>
<rect class="d-chip-sel" x="560" y="180" width="260" height="44" rx="22"/>
<text class="d-small t-sel" x="580" y="207">Build the Windows app</text>
<text class="d-sub" x="560" y="256">from Ship the widget on Laptop</text>
<path class="d-req" d="M324 190H556"/>
<path class="d-req" d="M547 182L556 190L547 198"/>
