<path d="M2 19h20"/></g>
<text x="94" y="120">Laptop</text>
<text class="d-sub" x="60" y="166">Your chat</text>
<rect class="d-chip" x="60" y="180" width="260" height="44" rx="22"/>
<text class="d-small" x="80" y="207">Ship the widget</text>
<text class="d-sub" x="60" y="256">1 task out: 1 working</text>
<rect class="d-panel" x="540" y="84" width="300" height="216" rx="14"/>
<g class="d-ico" transform="translate(560 102)"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/>
