<svg viewBox="0 0 880 340" role="img" aria-labelledby="fig-sent-task-t" xmlns="http://www.w3.org/2000/svg">
<title id="fig-sent-task-t">A chat on the laptop sends a task to the closet PC, where a new chat does it under the line Sent by Claude and sends its report back to the chat that asked.</title>
