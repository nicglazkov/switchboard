<svg viewBox="0 0 880 344" role="img" aria-labelledby="fig-term-keystroke-t" xmlns="http://www.w3.org/2000/svg">
<title id="fig-term-keystroke-t">A key pressed in the Switchboard app goes to your home computer, then to the chat's computer, and the redrawn screen comes back the same way.</title>
<text class="d-title" x="40" y="52">A keystroke and the screen it comes back with</text>
<rect class="d-panel" x="40" y="84" width="200" height="220" rx="14"/>
<g class="d-ico" transform="translate(128 102)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></g>
<text class="mid" x="140" y="148">The Switchboard app</text>
<rect class="d-chip" x="60" y="168" width="160" height="36" rx="18"/>
<text class="d-small mid" x="140" y="191">You press a key</text>
<rect class="d-chip" x="60" y="232" width="160" height="36" rx="18"/>
<text class="d-small mid" x="140" y="255">The tab redraws</text>
<rect class="d-panel" x="340" y="84" width="200" height="220" rx="14"/>
<g class="d-ico" transform="translate(428 102)"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></g>
<text class="mid" x="440" y="148">Your home computer</text>
<rect class="d-chip-sel" x="360" y="168" width="160" height="100" rx="16"/>
<text class="t-sel mid" x="440" y="214">Switchboard</text>
<text class="d-sub mid" x="440" y="236">passes both along</text>
<rect class="d-panel" x="640" y="84" width="200" height="220" rx="14"/>
<g class="d-ico" transform="translate(728 102)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<text class="mid" x="740" y="148">The chat's computer</text>
<rect class="d-chip" x="660" y="168" width="160" height="36" rx="18"/>
<text class="d-small mid" x="740" y="191">The chat gets the key</text>
<rect class="d-chip" x="660" y="232" width="160" height="36" rx="18"/>
<text class="d-small mid" x="740" y="255">Its screen changes</text>
<text class="d-sub mid" x="290" y="160">key</text>
<path class="d-req" d="M252 186H328M319 178L328 186L319 194"/>
<circle class="d-num-req" cx="290" cy="186" r="13"/>
<text class="d-num" x="290" y="186" dy="4.5">1</text>
<text class="d-sub mid" x="590" y="160">key</text>
<path class="d-req" d="M552 186H628M619 178L628 186L619 194"/>
<circle class="d-num-req" cx="590" cy="186" r="13"/>
<text class="d-num" x="590" y="186" dy="4.5">2</text>
<path class="d-ret" d="M628 250H552M561 242L552 250L561 258"/>
<circle class="d-num-ret" cx="590" cy="250" r="13"/>
<text class="d-num" x="590" y="250" dy="4.5">3</text>
<text class="d-sub mid" x="590" y="286">screen</text>
<path class="d-ret" d="M328 250H252M261 242L252 250L261 258"/>
<circle class="d-num-ret" cx="290" cy="250" r="13"/>
<text class="d-num" x="290" y="250" dy="4.5">4</text>
<text class="d-sub mid" x="290" y="286">screen</text>
</svg>
