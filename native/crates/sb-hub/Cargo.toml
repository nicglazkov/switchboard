[package]
name = "sb-hub"
description = "Switchboard hub: terminals in the browser and the apps. A PTY per terminal running ssh to the machine, relayed over a WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "switchboard-hub"
path = "src/main.rs"

[dependencies]
# Exact pins, like the rest of the workspace. hmac, sha2, base64 and getrandom match what Cargo.lock already had.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
portable-pty = "=0.9.0"
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.3.4"
serde.workspace = true
serde_json.workspace = true
# The shared screen (shared.rs): the same serializer the desktop app replays.
sb-core = { path = "../sb-core", features = ["grid"] }
alacritty_terminal.workspace = true

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
futures-util = "=0.3.34"
