[package]
name = "sb-mobile"
description = "Switchboard keys for the phone apps: pairs with the home computer and carries the app's own HTTP and WebSocket connections there, behind a small API for Swift and Kotlin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `lib` for the tests and the bindings generator, `staticlib` for the iOS XCFramework, `cdylib` for Android's .so.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# Writes the Swift and Kotlin files that call this crate (scripts/build-mobile-ios.sh, build-mobile-android.sh).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
# Everything that matters is sb-link's: the key, codes and links, the pairing exchange, the tunnel, the endpoint.
# (`standin`: what the two ports answer while the home computer is away, and the reaching of the other computers)
sb-link = { path = "../sb-link", features = ["standin"] }
# The sentences the desktop app says about a code that cannot be right, so the phones say the same.
sb-core = { path = "../sb-core" }
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde.workspace = true
serde_json.workspace = true
# The Swift and Kotlin sides of the API in lib.rs are generated from it. No UDL file: the attributes are the
# interface.
uniffi = { version = "=0.32.2" }
# The secret that keeps other apps on the phone off the loopback ports (gate.rs).
getrandom = "=0.3.4"
subtle = "=2.6.1"
# Sealed notifications (push.rs): HPKE as RFC 9180 writes it, from the pieces sb-link and sb-core already build with.
# Every one of these is in the library already, at this version, so the phone apps carry nothing new for it.
curve25519-dalek = { version = "=4.1.3", default-features = false }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
base64 = "=0.22.1"
zeroize = "=1.9.1"

# Android: the one plain JNI method (android.rs), which hands the library the app's Java side. The types only; the
# version the endpoint's own Android code is built with.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.4.1"

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
futures-util = "=0.3.34"
