# cargo-about settings for scripts/notices-mobile.sh: the keys library inside the phone apps (crates/sb-mobile).
# The same accepted licenses as about.toml; a crate under any other stops the script.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    # File-level copyleft: fine to ship in a binary with this notice; changes to those files would have to be shared.
    "MPL-2.0",
]
# Every phone the library is built for: iPhones and the simulators, Android phones and the emulators.
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The workspace's own crates (publish = false, AGPL-3.0) are this app, not third-party code.
private = { ignore = true }
