# cargo-about settings for scripts/notices.sh. A crate whose license is not listed here stops the script, so a new
# license gets a look before it ships.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    # File-level copyleft: fine to ship in a binary with this notice; changes to those files would have to be shared.
    # cbindgen (a build tool), dwrote (Windows fonts) and option-ext (via dirs) use it.
    "MPL-2.0",
]
# Every platform the app ships on, so platform-only crates (objc on macOS, windows-* on Windows) are covered.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
